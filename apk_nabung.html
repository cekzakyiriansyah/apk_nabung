<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabungan Barang</title>
<style>
:root{--bg:#f4f1e8;--card:#fffdf7;--tx:#1f2a22;--mu:#6d7a70;--ln:#e6e0cc;--ac:#1f8a5f;--ac2:#dff1e8;--go:#e8a91a;--go2:#fff1cc;--dg:#b3402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121712;--card:#1b231d;--tx:#eaf0ea;--mu:#9aa89d;--ln:#2c372e;--ac:#4cc79a;--ac2:#1d3529;--go:#f2c14e;--go2:#3a3014;--dg:#ee8a79}}
:root[data-theme="dark"]{--bg:#121712;--card:#1b231d;--tx:#eaf0ea;--mu:#9aa89d;--ln:#2c372e;--ac:#4cc79a;--ac2:#1d3529;--go:#f2c14e;--go2:#3a3014;--dg:#ee8a79}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#136b49,#1f8a5f 55%,#e8a91a);color:#fff;padding:26px 16px 70px}
.hero .in{max-width:760px;margin:0 auto;position:relative;z-index:2}
.hero h1{margin:0;font-size:26px}
.hero p{margin:4px 0 0;opacity:.92}
.fl{position:absolute;bottom:-30px;font-size:26px;opacity:.55;animation:up 9s linear infinite;z-index:1}
@keyframes up{to{transform:translateY(-260px) rotate(40deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.fl{animation:none;bottom:10px}}
.wrap{max-width:760px;margin:-52px auto 0;padding:0 16px 60px;position:relative;z-index:3}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.sum small{color:var(--mu);display:block;font-size:12px}
.sum b{font-size:16px;word-break:break-word}
.quote{background:var(--go2);border:1px dashed var(--go);border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.quote span{flex:1;font-style:italic}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.top{display:flex;gap:8px;align-items:center}
.em{font-size:26px;padding:2px 8px;background:var(--go2);border-color:var(--go)}
input{font:inherit;color:var(--tx);background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;min-width:0}
input:hover{border-color:var(--ln)}input:focus{outline:2px solid var(--ac);background:var(--bg)}
.nm{font-weight:700;font-size:18px;flex:1}
.tg{display:flex;align-items:center;gap:6px;color:var(--mu);margin:6px 0 10px}
.tg input{width:150px}
.bar{height:14px;background:var(--ac2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--go));border-radius:99px;transition:width .4s}
.st{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;margin:6px 0 4px;flex-wrap:wrap;gap:4px}
.msg{font-weight:600;margin:2px 0 10px}
.mon{border:1px solid var(--ln);border-radius:12px;padding:8px 10px;margin-top:10px}
.mh{display:flex;gap:6px;align-items:center}
.mh .lb{flex:1;font-weight:600}
.mt{color:var(--ac);font-weight:700;white-space:nowrap}
.row{display:flex;gap:6px;align-items:center;border-top:1px solid var(--ln);padding:4px 0;margin-top:4px;flex-wrap:wrap}
.row .dt{width:150px}.row .wd{color:var(--mu);font-size:12px;width:52px}
.row .am{width:120px;text-align:right}.row .nt{flex:1;min-width:90px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:6px 12px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.g{background:var(--go);color:#2b2100;border-color:var(--go);font-weight:600}
button.x{color:var(--dg);padding:4px 9px}
.act{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.empty{color:var(--mu);padding:8px 0}
.addbox{background:var(--card);border:2px dashed var(--go);border-radius:16px;padding:14px;margin-bottom:14px}
.addbox h3{margin:0 0 8px;font-size:16px}
.addbox input{border-color:var(--ln);width:100%;margin-bottom:8px;background:var(--bg)}
.pk{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pk button{font-size:20px;padding:4px 8px}
.pk button.on{background:var(--go2);border-color:var(--go);outline:2px solid var(--go)}
.pic{display:block;width:auto;max-width:100%;height:auto;max-height:300px;object-fit:contain;margin:10px auto 6px;border-radius:14px;background:var(--go2);border:1px solid var(--ln)}
.fbtn{display:inline-block;cursor:pointer;border:1px solid var(--ln);border-radius:10px;padding:6px 12px;background:var(--card);font-size:14px}
.fbtn:hover{border-color:var(--go)}
.imgrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.prev{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--ln)}
.ir{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px;justify-content:center}
@media(max-width:520px){.sum{grid-template-columns:1fr}.row .dt{width:135px}}
</style>
</head>
<body>
<div class="hero">
<span class="fl" style="left:6%;animation-delay:0s">🪙</span><span class="fl" style="left:22%;animation-delay:2s">💵</span><span class="fl" style="left:40%;animation-delay:4s">💰</span><span class="fl" style="left:58%;animation-delay:1s">🪙</span><span class="fl" style="left:74%;animation-delay:3s">💎</span><span class="fl" style="left:90%;animation-delay:5s">💸</span>
<div class="in"><h1>💰 Tabungan Barang</h1><p>Sedikit demi sedikit, lama-lama jadi bukit. Catat setoran per hari dan per bulan.</p></div>
</div>
<div class="wrap">
<div class="sum">
<div><small>🪙 Total terkumpul</small><b id="s1">Rp0</b></div>
<div><small>🎯 Total target</small><b id="s2">Rp0</b></div>
<div><small>⏳ Masih kurang</small><b id="s3">Rp0</b></div>
</div>
<div class="quote">✨<span id="q"></span><button id="qb" title="Kutipan lain">🔄</button></div>
<div class="addbox"><h3>🛍️ Mau nabung buat beli apa?</h3>
<input id="nn" placeholder="Nama barang yang diinginkan, misal: iPhone, Sepeda, Tiket konser" maxlength="60">
<input id="nt" inputmode="numeric" placeholder="Target harga (Rp), misal: 5000000">
<div class="imgrow"><label class="fbtn">🖼️ Pilih gambar barang<input type="file" id="nf" accept="image/*" hidden></label><img id="prev" class="prev" alt="Pratinjau" hidden></div>
<div class="pk" id="pk"></div>
<button class="g" id="addItem">➕ Tambah barang</button></div>
<div id="list"></div>
</div>
<script>
var KEY="tabungan-barang-v2",OLD="tabungan-barang-v1";
var BLN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var HR=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
var EMO=["🎁","💻","📱","🏍️","🚗","🏠","🎮","📷","🎧","👟","⌚","✈️","📚","🎸","🐶","💍"];
var QUOTES=["Sedikit demi sedikit, lama-lama menjadi bukit.","Menabung bukan soal besar kecilnya, tapi soal konsistensinya.","Hari ini nabung, besok tinggal menikmati.","Jangan tunggu kaya untuk menabung, menabunglah supaya kaya.","Setiap rupiah yang kamu simpan adalah langkah menuju impianmu.","Sabar dan konsisten, barang impianmu pasti terbeli.","Uang receh hari ini adalah barang impian esok hari.","Disiplin hari ini, bahagia di hari nanti.","Yang penting mulai dulu, besarnya menyusul."];
var items=[];
function uid(){return Math.random().toString(36).slice(2,9)}
function rp(n){return "Rp"+Math.round(n||0).toLocaleString("id-ID")}
function num(v){return Math.max(0,parseInt(String(v).replace(/\D/g,""),10)||0)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function iso(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function load(){
try{var r=localStorage.getItem(KEY);if(r)items=JSON.parse(r)}catch(e){}
if(!items.length){try{var o=localStorage.getItem(OLD);if(o){items=JSON.parse(o).map(function(it){return{id:it.id,name:it.name,emoji:"🎁",target:it.target,months:it.months.map(function(m){return{id:m.id,label:m.label,days:m.amount?[{id:uid(),date:iso(new Date()),amount:m.amount,note:""}]:[]}})}})}}catch(e){}}
if(!items.length)items=[{id:uid(),name:"Laptop baru",emoji:"💻",target:10000000,months:[{id:uid(),label:BLN[new Date().getMonth()]+" "+new Date().getFullYear(),days:[{id:uid(),date:iso(new Date()),amount:50000,note:"Setoran pertama"}]}]}]}
var warned=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){if(!warned){warned=true;alert("Penyimpanan browser penuh, gambar terlalu banyak. Hapus beberapa gambar agar data tetap tersimpan.")}}}
function readImg(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",0.78))};im.src=r.result};r.readAsDataURL(file)}
function imgBlock(it){
if(it.img)return '<img class="pic" src="'+it.img+'" alt="'+esc(it.name)+'"><div class="ir"><label class="fbtn">🖼️ Ganti gambar<input type="file" accept="image/*" data-f="img" hidden></label><button data-a="delImg">Hapus gambar</button></div>';
return '<div class="ir"><label class="fbtn">🖼️ Tambah gambar<input type="file" accept="image/*" data-f="img" hidden></label></div>'}
var newImg="";
function mTot(m){return m.days.reduce(function(a,d){return a+d.amount},0)}
function total(it){return it.months.reduce(function(a,m){return a+mTot(m)},0)}
function parseM(l){var m=String(l).match(/^(\S+)\s+(\d{4})$/);if(!m)return null;var i=BLN.indexOf(m[1]);return i<0?null:{y:+m[2],m:i}}
function nextLabel(ms){var d=new Date();if(ms.length){var p=parseM(ms[ms.length-1].label);if(p)d=new Date(p.y,p.m+1,1)}return BLN[d.getMonth()]+" "+d.getFullYear()}
function nextDay(m){
var p=parseM(m.label),t=new Date();
if(!p)return iso(t);
if(m.days.length){var l=new Date(m.days[m.days.length-1].date+"T00:00:00");l.setDate(l.getDate()+1);
if(l.getMonth()===p.m&&l.getFullYear()===p.y)return iso(l);return iso(new Date(p.y,p.m,Math.min(28,l.getDate())))}
if(t.getMonth()===p.m&&t.getFullYear()===p.y)return iso(t);
return iso(new Date(p.y,p.m,1))}
function wd(s){var d=new Date(s+"T00:00:00");return isNaN(d)?"":HR[d.getDay()]}
function msg(p,done){
if(done)return"🎉 Target tercapai! Saatnya beli barang impianmu!";
if(p===0)return"🌱 Mulai dari recehan dulu, yang penting mulai.";
if(p<25)return"🪙 Awal yang bagus, terus lanjutkan!";
if(p<50)return"💪 Hampir setengah jalan, jangan kendor!";
if(p<75)return"🔥 Sudah lebih dari setengah, semangat!";
return"🚀 Tinggal sedikit lagi, kamu hampir sampai!"}
function render(){
var h="",T=0,G=0;
items.forEach(function(it){
var t=total(it),done=it.target>0&&t>=it.target,pct=it.target?Math.min(100,t/it.target*100):0,sisa=Math.max(0,it.target-t);
T+=t;G+=it.target;
var nd=0;it.months.forEach(function(m){nd+=m.days.length});
var avg=nd?t/nd:0,est=sisa>0&&avg>0?"~"+Math.ceil(sisa/avg)+" setoran lagi":"";
h+='<div class="card" data-id="'+it.id+'"><div class="top"><button class="em" data-a="emo" title="Ganti emoji">'+it.emoji+'</button><input class="nm" data-f="name" value="'+esc(it.name)+'" aria-label="Nama barang"><button class="x" data-a="delItem" title="Hapus barang">🗑️</button></div>'
+imgBlock(it)+'<div class="tg">🎯 Target: Rp<input data-f="target" inputmode="numeric" value="'+it.target.toLocaleString("id-ID")+'"></div>'
+'<div class="bar"><i style="width:'+pct+'%"></i></div>'
+'<div class="st"><span>💰 '+rp(t)+' ('+pct.toFixed(0)+'%)</span><span>Kurang '+rp(sisa)+'</span><span>'+est+'</span></div>'
+'<div class="msg">'+msg(pct,done)+'</div>';
if(!it.months.length)h+='<div class="empty">Belum ada bulan. Tambah bulan pertama 👇</div>';
it.months.forEach(function(m){
h+='<div class="mon" data-m="'+m.id+'"><div class="mh">📅<input class="lb" data-f="label" value="'+esc(m.label)+'" aria-label="Bulan"><span class="mt">'+rp(mTot(m))+'</span><button class="x" data-a="delMonth" title="Hapus bulan">✕</button></div>';
m.days.forEach(function(d){
h+='<div class="row" data-d="'+d.id+'"><input class="dt" type="date" data-f="date" value="'+esc(d.date)+'"><span class="wd">'+wd(d.date)+'</span>Rp<input class="am" data-f="amount" inputmode="numeric" value="'+d.amount.toLocaleString("id-ID")+'"><input class="nt" data-f="note" placeholder="Catatan (opsional)" value="'+esc(d.note||"")+'"><button class="x" data-a="delDay" title="Hapus hari">✕</button></div>'});
h+='<div class="act"><button data-a="addDay">➕ Tambah hari</button></div></div>'});
h+='<div class="act"><button class="p" data-a="addMonth">📅 Tambah bulan</button></div></div>'});
if(!items.length)h='<div class="empty">Belum ada barang. Klik "Tambah barang" 👇</div>';
document.getElementById("list").innerHTML=h;
document.getElementById("s1").textContent=rp(T);
document.getElementById("s2").textContent=rp(G);
document.getElementById("s3").textContent=rp(Math.max(0,G-T))}
function find(e){var c=e.target.closest(".card");if(!c)return{};
var it=items.filter(function(x){return x.id===c.dataset.id})[0],mr=e.target.closest(".mon"),dr=e.target.closest(".row"),m=null,d=null;
if(it&&mr)m=it.months.filter(function(x){return x.id===mr.dataset.m})[0];
if(m&&dr)d=m.days.filter(function(x){return x.id===dr.dataset.d})[0];return{it:it,m:m,d:d}}
var lst=document.getElementById("list");
lst.addEventListener("change",function(e){
var f=e.target.dataset.f;if(!f)return;var o=find(e);if(!o.it)return;var v=e.target.value;
if(f==="img"){var fl=e.target.files[0];if(!fl)return;readImg(fl,function(u){o.it.img=u;save();render()});return}
if(f==="name")o.it.name=v||"Barang";
else if(f==="target")o.it.target=num(v);
else if(f==="label"&&o.m&&!o.d)o.m.label=v;
else if(o.d){if(f==="date")o.d.date=v||iso(new Date());else if(f==="amount")o.d.amount=num(v);else o.d.note=v}
save();render()});
lst.addEventListener("click",function(e){
var b=e.target.closest("button");if(!b||!b.dataset.a)return;var a=b.dataset.a;e.target=b;var o=find(e);
if(a==="emo"){o.it.emoji=EMO[(EMO.indexOf(o.it.emoji)+1)%EMO.length]}
if(a==="delImg")delete o.it.img;
if(a==="addMonth")o.it.months.push({id:uid(),label:nextLabel(o.it.months),days:[]});
if(a==="addDay")o.m.days.push({id:uid(),date:nextDay(o.m),amount:0,note:""});
if(a==="delDay")o.m.days=o.m.days.filter(function(x){return x!==o.d});
if(a==="delMonth"){if(!confirm("Hapus bulan ini beserta semua harinya?"))return;o.it.months=o.it.months.filter(function(x){return x!==o.m})}
if(a==="delItem"){if(!confirm("Hapus barang ini beserta semua setorannya?"))return;items=items.filter(function(x){return x!==o.it})}
save();render()});
var pick=EMO[0];
function renderPick(){document.getElementById("pk").innerHTML=EMO.map(function(e){return '<button type="button" data-e="'+e+'" class="'+(e===pick?'on':'')+'">'+e+'</button>'}).join("")}
document.getElementById("pk").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;pick=b.dataset.e;renderPick()});
document.getElementById("addItem").addEventListener("click",function(){
var n=document.getElementById("nn"),t=document.getElementById("nt");
if(!n.value.trim()){n.focus();return}
var ni={id:uid(),name:n.value.trim(),emoji:pick,target:num(t.value),months:[]};if(newImg)ni.img=newImg;items.push(ni);
n.value="";t.value="";newImg="";document.getElementById("prev").hidden=true;document.getElementById("nf").value="";save();render();
var c=document.querySelectorAll(".card");if(c.length)c[c.length-1].scrollIntoView({behavior:"smooth",block:"center"})});
renderPick();
document.getElementById("nf").addEventListener("change",function(e){var f=e.target.files[0];if(!f)return;readImg(f,function(u){newImg=u;var p=document.getElementById("prev");p.src=u;p.hidden=false})});
function quote(){document.getElementById("q").textContent="“"+QUOTES[Math.floor(Math.random()*QUOTES.length)]+"”"}
document.getElementById("qb").addEventListener("click",quote);
load();quote();render();
</script>
</body>
</html>
